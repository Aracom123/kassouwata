# Variables locales (secrets) : fichier .env a la racine de kassouwata-back, non versionne
spring.config.import=optional:file:.env[.properties]

spring.application.name=kassouwata-back

# Base de donnees
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
# URL et utilisateur non secrets : valeurs fixes (Docker les remplace via SPRING_DATASOURCE_URL / _USERNAME)
spring.datasource.url=jdbc:postgresql://localhost:5432/kassouwata_db
spring.datasource.username=kassouwa_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true


#Serveur infos
server.port=8082
# server.address=127.0.0.1
server.forward-headers-strategy=framework
upload.path=/home/beit/public_html/kassouwata.beit.ne/backend/images/
# upload.path=/home/beit/public_html/kassouwata.beit.ne/backend/images/

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Agregateur de paiement (Mobile Money / Carte) - valeurs dans .env
payment.gateway.base-url=${PAYMENT_BASE_URL}
# Base des transactions (b2c_standard, crypt-cvv, check-transaction-status), differente de celle du jeton
payment.gateway.transaction-base-url=${PAYMENT_TRANSACTION_BASE_URL:${PAYMENT_BASE_URL}/customers-api-kp/v1}
payment.gateway.login=${PAYMENT_LOGIN}
payment.gateway.password=${PAYMENT_PASSWORD}
payment.gateway.api-key=${PAYMENT_API_KEY}
payment.gateway.keypass=${PAYMENT_KEYPASS}
